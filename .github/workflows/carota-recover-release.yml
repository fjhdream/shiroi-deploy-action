name: Recover deployment release 53
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: assets
          key: 53-release
          fail-on-cache-miss: true
      - name: Encrypt temporary transfer package
        env:
          CAROTA_RELEASE_TRANSFER_KEY: ${{ secrets.CAROTA_RELEASE_TRANSFER_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const key = Buffer.from(process.env.CAROTA_RELEASE_TRANSFER_KEY, 'hex');
          assert.equal(key.length, 32);
          const data = fs.readFileSync('assets/release.zip');
          assert.ok(data.length > 1000000);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const encrypted = Buffer.concat([cipher.update(data), cipher.final()]);
          fs.writeFileSync('carota-release-53.enc', Buffer.concat([Buffer.from('CAROTA1'), iv, cipher.getAuthTag(), encrypted]));
          console.log(JSON.stringify({release: 53, bytes: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex')}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: carota-release-53-encrypted
          path: carota-release-53.enc
          compression-level: 0
          retention-days: 1
